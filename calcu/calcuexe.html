<!DOCTYPE html>
<html>
  <head>
    <title>Calculator</title>
    <link rel="stylesheet" href="styles/calcu.css" >
  </head>

  <body>
    <p class="js-display style-display"></p>

    <!-- Row 1 -->
    <button onclick="updateCalculation('1');" class="num-button">1</button>
    <button onclick="updateCalculation('2');" class="num-button">2</button>
    <button onclick="updateCalculation('3');" class="num-button">3</button>
    <button onclick="updateCalculation(' + ');"  class="ope-button">+</button>

    <!-- Row 2 -->
    <p>
      <button onclick="updateCalculation('4');" class="num-button">4</button>
      <button onclick="updateCalculation('5');" class="num-button">5</button>
      <button onclick="updateCalculation('6');" class="num-button">6</button>
      <button onclick="updateCalculation(' - ');" class="ope-button">-</button>
    </p>

    <!-- Row 3 -->
    <p>
      <button onclick="updateCalculation('7');" class="num-button">7</button>
      <button onclick="updateCalculation('8');" class="num-button">8</button>
      <button onclick="updateCalculation('9');" class="num-button">9</button>
      <button onclick="updateCalculation(' * ');" class="ope-button">*</button>
    </p>

    <!-- Row 4 -->
    <p>
      <button onclick="updateCalculation('0');" class="num-button">0</button>
      <button onclick="updateCalculation('.');" class="num-button">.</button>
      <button onclick="
        calculation = eval(calculation);
        displayCalculation();
        localStorage.setItem('calculation', calculation);
      " class="num-button">=</button>
      <button onclick="updateCalculation(' / ');" class="ope-button">/</button>
    </p>

    <!-- Clear Button -->
    <button onclick="
      calculation = '';
      console.log('Cleared.');
      displayCalculation();
      localStorage.removeItem('calculation');
    " class="num-button-clear">Clear</button>

    <script src="script/calcu.js"></script>
  </body>
</html>
