<!DOCTYPE html>
<html>
	<head>
		<title>Coin Flip</title>
	</head>

  <body>
    <p>Guess the Coin Flip</p>
    <button onclick="
    playGame('Heads');
    ">I guess Heads!</button>

    <button onclick="
    playGame('Tails');
    ">I guess Tails!</button>

	  <script>
				let score = JSON.parse(localStorage.getItem('score')) || {
					wins:0,
					losses:0, 
				}

        let result = '';
        let outcome = '';

				function playGame(guess) {
					const randomNumber = Math.random();
					result = randomNumber < 0.5 ? 'Heads' : 'Tails';

					if(guess === 'Heads'){
						outcome = result === 'Heads' ? 'You win!' : 'You lose!';
					}else if(guess === 'Tails'){
						outcome = result === 'Tails' ? 'You win!' : 'You lose!';
					}

					if(outcome === 'You win!'){
						score.wins++;
					}else{
						score.losses++;
					} 

					localStorage.setItem('score', JSON.stringify(score));

					alert(`You guessed ${guess}! The coin flip was: ` + result + '\n' + outcome + '\n\nWins: ' + score.wins + ' Losses: ' + score.losses);					

				}
      </script>

  </body>
</html>
